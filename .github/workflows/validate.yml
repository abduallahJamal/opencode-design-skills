name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Frontmatter + platform sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check shell scripts
        run: bash -n install.sh scripts/*.sh

      - name: Check generated copies match the canonical source
        run: ./scripts/sync-platforms.sh --check

      - name: Validate SKILL.md frontmatter and documentation links
        run: |
          pip install --quiet pyyaml
          python scripts/validate.py --github-annotations
